name: Scrape menus

on:
  schedule:
    # Run at 09:30 in Slovakia during daylight saving time (07:30 UTC).
    # GitHub Actions schedules use UTC and can start a few minutes late.
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run scraper
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: dotnet run --project scraper -- docs/menus.json

      - name: Commit updated menus.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/menus.json
          git diff --cached --quiet || git commit -m "Update menus $(date +%Y-%m-%d)"
          git push
